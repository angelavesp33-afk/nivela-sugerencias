<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivela · Buzón de sugerencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EC;
    --ink:#423C33;
    --ink-soft:#8A8171;
    --blue:#5B9AD6;
    --blue-dark:#3E7FBD;
    --blue-tint:#EAF2FA;
    --coral:#EA8B84;
    --coral-tint:#FBEAE7;
    --green:#7FAE8C;
    --green-tint:#EAF3EC;
    --line:#E9E1D2;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:48px 20px 80px;
  }
  header{
    text-align:center;
    margin-bottom:40px;
  }
  header img{
    width:150px;
    height:auto;
    display:block;
    margin:0 auto 18px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(26px,5vw,32px);
    margin:0 0 10px;
    color:var(--ink);
  }
  header p{
    font-size:16px;
    line-height:1.55;
    color:var(--ink-soft);
    max-width:440px;
    margin:0 auto;
  }
  .setup-warning{
    background:var(--coral-tint);
    color:#B0554C;
    border-radius:14px;
    padding:16px 18px;
    font-size:14px;
    line-height:1.6;
    margin-bottom:32px;
  }
  .setup-warning code{
    background:rgba(255,255,255,0.6);
    padding:1px 6px;
    border-radius:6px;
  }

  .form-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 26px;
    box-shadow:0 10px 30px -18px rgba(66,60,51,0.25);
    margin-bottom:48px;
  }
  .form-card h2{
    font-family:'Baloo 2', sans-serif;
    font-size:19px;
    margin:0 0 18px;
    color:var(--ink);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field{margin-bottom:16px;}
  input[type="text"], textarea{
    width:100%;
    font-family:'Nunito Sans', sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--ink);
    resize:vertical;
  }
  textarea{min-height:96px;}
  input[type="text"]:focus, textarea:focus, input[type="password"]:focus{
    outline:none;
    border-color:var(--blue);
    background:var(--white);
  }
  .submit-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:6px;
  }
  .hint{font-size:12.5px;color:var(--ink-soft);}
  button{
    font-family:'Nunito Sans', sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    background:var(--blue);
    color:var(--white);
    font-weight:700;
    font-size:14.5px;
    padding:12px 22px;
    border-radius:999px;
    transition:background 0.15s ease;
    white-space:nowrap;
  }
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-primary:disabled{background:#C9CDD2;cursor:not-allowed;}

  .list-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .list-head h2{
    font-family:'Baloo 2', sans-serif;
    font-size:19px;
    margin:0;
  }
  .list-head span{font-size:13.5px;color:var(--ink-soft);}

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    border-radius:16px;
    font-size:14.5px;
    line-height:1.6;
  }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    margin-bottom:14px;
  }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .who{font-weight:800;font-size:14.5px;}
  .when{font-size:12.5px;color:var(--ink-soft);}
  .status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:700;
  }
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.pending{background:var(--coral);}
  .dot.answered{background:var(--green);}
  .status.pending{color:#C96B62;}
  .status.answered{color:#4F8360;}
  .msg{font-size:15px;line-height:1.6;color:var(--ink);margin:0 0 4px;white-space:pre-wrap;}

  .reply{
    margin-top:14px;
    background:var(--green-tint);
    border-left:3px solid var(--green);
    border-radius:0 12px 12px 0;
    padding:12px 16px;
  }
  .reply .label{font-size:12px;font-weight:800;color:#4F8360;margin-bottom:4px;}
  .reply p{margin:0;font-size:14.5px;line-height:1.55;white-space:pre-wrap;}

  .admin-reply{margin-top:14px;}
  .admin-reply textarea{min-height:70px;margin-bottom:8px;}
  .admin-actions{display:flex;gap:8px;}
  .btn-secondary{
    background:var(--blue-tint);
    color:var(--blue-dark);
    font-weight:700;
    font-size:13.5px;
    padding:9px 16px;
    border-radius:999px;
  }
  .btn-secondary:hover{background:#DCEAF7;}
  .link-btn{
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    padding:6px 0;
  }

  footer{
    margin-top:56px;
    text-align:center;
  }
  .team-toggle{
    font-size:13px;
    color:var(--ink-soft);
    background:none;
    text-decoration:underline;
  }
  .team-panel{
    display:inline-flex;
    gap:8px;
    align-items:center;
    margin-top:10px;
  }
  .team-panel input{
    width:140px;
    padding:9px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:14px;
  }
  .team-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--blue-tint);
    color:var(--blue-dark);
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
  }
  .team-badge button{
    background:none;
    color:var(--blue-dark);
    text-decoration:underline;
    font-size:12.5px;
    font-weight:600;
    padding:0;
  }
  .error-banner{
    background:var(--coral-tint);
    color:#B0554C;
    border-radius:12px;
    padding:12px 16px;
    font-size:13.5px;
    margin-bottom:20px;
  }
  .loading{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:30px 0;
  }
</style>
</head>

    <h1>Buzón de sugerencias</h1>
    <p>Cuéntanos qué te gustaría probar, cambiar o mejorar. Leemos cada mensaje y respondemos aquí mismo.</p>
  </header>

  <div id="setupWarning"></div>
  <div id="errorBanner"></div>

  <section class="form-card">
    <h2>Deja tu sugerencia</h2>
    <div class="field">
      <label for="nameInput">Tu nombre (opcional)</label>
      <input type="text" id="nameInput" maxlength="60" placeholder="Anónimo">
    </div>
    <div class="field">
      <label for="msgInput">Tu sugerencia</label>
      <textarea id="msgInput" maxlength="600" placeholder="Ej. Me encantaría un sabor de mango con chile..."></textarea>
    </div>
    <div class="submit-row">
      <span class="hint" id="charHint">0 / 600</span>
      <button class="btn-primary" id="submitBtn">Enviar sugerencia</button>
    </div>
  </section>

  <div class="list-head">
    <h2>Sugerencias</h2>
    <span id="countLabel"></span>
  </div>

  <div id="listContainer">
    <div class="loading">Cargando sugerencias…</div>
  </div>

  <footer id="footerArea"></footer>
</div>

<script>
// ======= CONFIGURACIÓN =======
// Pega aquí la URL de tu aplicación web de Google Apps Script
// (la que copias al desplegarla). Ver instrucciones que te di aparte.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwR5wPQd1XhsCZcyD5d5dWJ_e_u6_8r1cH9Nc6Z2xImsYLqAHWV9ly3BRwSQovmcUZ3yg/exec";

const ADMIN_PIN = "nivela2026"; // debe coincidir con el PIN del archivo Code.gs

let suggestions = [];
let isAdmin = false;

const listContainer = document.getElementById('listContainer');
const countLabel = document.getElementById('countLabel');
const footerArea = document.getElementById('footerArea');
const errorBanner = document.getElementById('errorBanner');
const setupWarning = document.getElementById('setupWarning');
const msgInput = document.getElementById('msgInput');
const nameInput = document.getElementById('nameInput');
const charHint = document.getElementById('charHint');
const submitBtn = document.getElementById('submitBtn');

if(SCRIPT_URL.indexOf('PEGA_AQUI') !== -1){
  setupWarning.innerHTML = '<div class="setup-warning">Falta conectar el backend: reemplaza <code>SCRIPT_URL</code> en el código de esta página con la URL de tu aplicación web de Google Apps Script.</div>';
}

msgInput.addEventListener('input', () => {
  charHint.textContent = msgInput.value.length + ' / 600';
});

function showError(text){
  errorBanner.innerHTML = '<div class="error-banner">' + text + '</div>';
}
function clearError(){ errorBanner.innerHTML = ''; }

function formatDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'}) +
      ' · ' + d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return ''; }
}

async function callApi(payload){
  // Content-Type: text/plain evita el preflight CORS que Apps Script no maneja bien.
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('network');
  return res.json();
}

async function loadAll(){
  const data = await callApi({ action: 'list' });
  if(!data.ok) throw new Error(data.error || 'error');
  return data.items || [];
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  countLabel.textContent = suggestions.length
    ? suggestions.length + (suggestions.length === 1 ? ' mensaje' : ' mensajes')
    : '';

  if(!suggestions.length){
    listContainer.innerHTML = '<div class="empty">Todavía no hay sugerencias.<br>Sé la primera persona en escribir una arriba.</div>';
  } else {
    const sorted = [...suggestions].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    listContainer.innerHTML = sorted.map(item => cardHtml(item)).join('');
  }

  renderFooter();
  attachCardEvents();
}

function cardHtml(item){
  const answered = !!item.reply;
  const who = item.name && item.name.trim() ? escapeHtml(item.name.trim()) : 'Anónimo';
  let html = `
    <div class="card" data-id="${item.id}">
      <div class="card-top">
        <div>
          <span class="who">${who}</span>
          <span class="when"> · ${formatDate(item.createdAt)}</span>
        </div>
        <span class="status ${answered ? 'answered' : 'pending'}">
          <span class="dot ${answered ? 'answered' : 'pending'}"></span>
          ${answered ? 'Respondida' : 'Pendiente'}
        </span>
      </div>
      <p class="msg">${escapeHtml(item.message)}</p>
  `;

  if(answered && !item.editingReply){
    html += `
      <div class="reply">
        <div class="label">Respuesta del equipo Nivela</div>
        <p>${escapeHtml(item.reply)}</p>
      </div>
    `;
    if(isAdmin){
      html += `<button class="link-btn" data-action="edit-reply" data-id="${item.id}">Editar respuesta</button>`;
    }
  }

  if(isAdmin && (!answered || item.editingReply)){
    html += `
      <div class="admin-reply">
        <textarea data-role="reply-input" data-id="${item.id}" placeholder="Escribe tu respuesta...">${answered ? escapeHtml(item.reply) : ''}</textarea>
        <div class="admin-actions">
          <button class="btn-secondary" data-action="save-reply" data-id="${item.id}">Guardar respuesta</button>
          ${item.editingReply ? `<button class="link-btn" data-action="cancel-edit" data-id="${item.id}">Cancelar</button>` : ''}
        </div>
      </div>
    `;
  }

  html += `</div>`;
  return html;
}

function renderFooter(){
  if(isAdmin){
    footerArea.innerHTML = `
      <span class="team-badge">Modo equipo activo
        <button data-action="logout">Salir</button>
      </span>
    `;
  } else {
    footerArea.innerHTML = `<button class="team-toggle" id="teamToggleBtn">Acceso equipo</button>`;
  }
}

function attachCardEvents(){
  listContainer.querySelectorAll('[data-action="edit-reply"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = suggestions.find(s => s.id === btn.dataset.id);
      item.editingReply = true;
      render();
    });
  });
  listContainer.querySelectorAll('[data-action="cancel-edit"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = suggestions.find(s => s.id === btn.dataset.id);
      delete item.editingReply;
      render();
    });
  });
  listContainer.querySelectorAll('[data-action="save-reply"]').forEach(btn => {
    btn.addEventListener('click', () => saveReply(btn.dataset.id));
  });
}

async function saveReply(id){
  const textarea = listContainer.querySelector(`textarea[data-id="${id}"]`);
  const text = textarea.value.trim();
  if(!text) return;
  clearError();
  const btn = listContainer.querySelector(`[data-action="save-reply"][data-id="${id}"]`);
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  try{
    const data = await callApi({ action: 'reply', id: id, reply: text, pin: ADMIN_PIN });
    if(!data.ok) throw new Error(data.error || 'error');
    suggestions = await loadAll();
    render();
  }catch(e){
    showError('No se pudo guardar la respuesta. Revisa tu conexión e intenta de nuevo.');
    btn.disabled = false;
    btn.textContent = 'Guardar respuesta';
  }
}

async function handleSubmit(){
  const message = msgInput.value.trim();
  if(!message){
    msgInput.focus();
    return;
  }
  clearError();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando…';
  try{
    const data = await callApi({ action: 'add', name: nameInput.value.trim(), message: message });
    if(!data.ok) throw new Error(data.error || 'error');
    suggestions = await loadAll();
    nameInput.value = '';
    msgInput.value = '';
    charHint.textContent = '0 / 600';
    render();
  }catch(e){
    showError('No se pudo enviar tu sugerencia. Revisa tu conexión e intenta de nuevo.');
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'Enviar sugerencia';
}

submitBtn.addEventListener('click', handleSubmit);

footerArea.addEventListener('click', (e) => {
  if(e.target.id === 'teamToggleBtn'){
    footerArea.innerHTML = `
      <div class="team-panel">
        <input type="password" id="pinInput" placeholder="Código de equipo">
        <button class="btn-secondary" id="pinSubmit">Entrar</button>
      </div>
    `;
    document.getElementById('pinInput').focus();
  }
  if(e.target.id === 'pinSubmit'){
    const pin = document.getElementById('pinInput').value;
    if(pin === ADMIN_PIN){
      isAdmin = true;
      render();
    }else{
      showError('Código incorrecto.');
    }
  }
  if(e.target.closest('[data-action="logout"]')){
    isAdmin = false;
    render();
  }
});

document.getElementById('footerArea').addEventListener('keydown', (e) => {
  if(e.target.id === 'pinInput' && e.key === 'Enter'){
    document.getElementById('pinSubmit').click();
  }
});

(async function init(){
  try{
    suggestions = await loadAll();
  }catch(e){
    showError('No se pudo cargar el buzón. Revisa que la URL de Apps Script esté bien configurada.');
    suggestions = [];
  }
  render();
})();
</script>
</body>
</html>
